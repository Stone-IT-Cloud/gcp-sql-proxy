default_stages: [commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.1.6
    hooks:
      - id: golangci-lint
        files: '^(go\.mod|go\.sum|.*\.go)$'
        args: [--timeout=5m]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: '^(go\.mod|go\.sum|.*\.go)$'

      - id: go-test
        name: go test -short
        entry: go test -short ./...
        language: system
        pass_filenames: false
        files: '^(go\.mod|go\.sum|.*\.go)$'
